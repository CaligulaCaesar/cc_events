dpe_smallpos_events.13.name: "杰出政治家崭露头角"
dpe_smallpos_events.13.desc: "[dpe_talent_leader.GetName]是[root.GetDPETalentFlavour] [dpe_talent_planet.GetName][root.GetDPETalentFlavour1]，[dpe_talent_leader.GetHisHer]领袖气质与杰出政绩令来访的[root.GetSpeciesAdj]官员印象深刻。他们建议在扩充[root.GetName]统治结构的高层时优先考虑这一人选。然而，[dpe_talent_leader.GetName]深受[dpe_talent_planet.GetName]民众爱戴，他们不愿看到自己的领袖离开。"
dpe_smallpos_events.13.A: "提拔[dpe_talent_leader.GetHimHer] "
dpe_smallpos_events.13.A.tooltip: "[dpe_talent_leader.GetName]是一位3级总督，拥有特性$leader_trait_dpe_talented$及$leader_trait_intellectual$，现将加入领袖库。"
