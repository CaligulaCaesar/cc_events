dpe_smallpos_events.12.name: "天才将领崭露头角"
dpe_smallpos_events.12.desc: "[dpe_talent_leader.GetName]是一位[root.GetDPETalentFlavour][dpe_talent_planet.GetName][root.GetDPETalentFlavour1]的军官，其领袖才能令来访的[root.GetSpeciesAdj]陆军官员们如此印象深刻，他们直接建议将[dpe_talent_leader.GetSheHe]提升为帝国陆军将领。然而，[dpe_talent_planet.GetName]十分希望将[dpe_talent_leader.GetHimHer]留在当地以负责行星防卫。"
