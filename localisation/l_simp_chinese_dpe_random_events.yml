cc_events_mod.57.name: "新锐企业强势崛起"
cc_events_mod.57.desc: "[dpe_merchant_planet.GetName]上一家私人商业公司正在你的人民中越来越受欢迎。这家公司的科学家研发出了现代计算科学的数种独创应用，使得直到不久之前对于普罗大众来说都难以企及的狂野梦想得以实现！公司CEO[dpe_CEO.GetName]迅速成为了[root.GetName]最富有的人之一。[dpe_CEO.GetSheHeCap]已为自己的产品申请了专利，以确保其优势地位。"

cc_events_mod.57.A: "[dpe_CEO.GetSheHeCap]会得到专利的"
cc_events_mod.57.B: "将相关研究查封--它对国家利益至关重要"
cc_events_mod.57.C: "否决专利申请，鼓励竞争"

