#Unity Planet
dpe_smallpos_events.2.name: "[root.GetName]向[root.owner.GetRulerTitle] [root.owner.GetRulerName]致敬"
dpe_smallpos_events.2.desc: "[root.GetName]长期以来都是[root.owner.GetName]政府最坚定的支持者之一。今天，他们的行星总管为一尊[root.owner.GetRulerTitle] [root.owner.GetRulerName]的塑像揭幕，以赞颂[root.owner.leader.GetSheHe]为这颗星球及整个国家作出的贡献，并宣示当地对[root.owner.GetName]的忠诚。"

dpe_unity_planet: "政府支持者"
dpe_unity_planet_desc: "这颗星球的公民属于政府最坚定的支持者行列之中"


#Leader Debate
dpe_smallpos_events.4.name: "[root.GetRulerTitle] [root.GetRulerName]雄辩无敌！"
dpe_smallpos_events.4.desc: "由[dpe_dissident_faction_leader.GetName]领导的[dpe_dissident_faction.GetName]派系一段时间以来对政府政策大加鞭笞，削弱了国内团结。今天，在一场面向全体[root.GetSpeciesAdj]民众的辩论中，[root.GetRulerTitle] [root.GetRulerName]与[dpe_dissident_faction_leader.GetName]正面交锋，令人信服地驳斥了对方的所有批评，同时为大家描绘了一幅令全体[root.GetSpeciesNamePlural]都心向往之的美好未来图景。"
dpe_smallpos_events.4.option: "我们大家可以带着这股重新燃起的乐观继续前行了！"

dpe_smallpos_events.5.name: "[root.GetRulerTitle] [root.GetRulerName]毫无说服力！"
dpe_smallpos_events.5.desc: "由[dpe_dissident_faction_leader.GetName]领导的[dpe_dissident_faction.GetName]派系一段时间以来对政府政策大加鞭笞，削弱了国内团结。今天，在一场面向全体[root.GetSpeciesAdj]民众的辩论中，[root.GetRulerTitle] [root.GetRulerName]与[dpe_dissident_faction_leader.GetName]正面交锋，试图驳斥对方的批评。然而他的努力适得其反，反而是[dpe_dissident_faction_leader.GetName]显得更具说服力。此事更进一步地削弱了执政派系的影响力。"

dpe_persuasive_leader: "雄辩的领袖"
dpe_unpersuasive_leader: "笨嘴拙舌的领袖"





