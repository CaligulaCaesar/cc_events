dpe_smallpos_events.11.name: "天才科学家崭露头角"
dpe_smallpos_events.11.desc: "[dpe_talent_leader.GetName]是一位[root.GetDPETalentFlavour][dpe_talent_planet.GetName] [root.GetDPETalentFlavour1]的教授，专精于[root.GetDPETalentField]领域。[dpe_talent_leader.GetHimHer]在自己的领域取得了突破性进展。你的一些顾问建议聘用[dpe_talent_leader.GetHimHer]，让[dpe_talent_leader.GetHimHer]在国家层面继续开展研究，不过其母星的学术团体十分希望能将[dpe_talent_leader.GetHimHer]留在当地。"
dpe_smallpos_events.11.A: "聘用[dpe_talent_leader.GetHimHer]"
#Spend normal leader costs
dpe_smallpos_events.11.A.tooltip: "[dpe_talent_leader.GetName]是一位专精于[root.GetDPETalentField]的3级科学家，拥有特性$leader_trait_dpe_talented$，现将加入领袖库。"
dpe_smallpos_events.11.B: "[dpe_talent_leader.GetSheHeCap]对[dpe_talent_planet.GetName]更有价值"

