cc_authoritarian_influence1: "君主制的精神遗产"
cc_authoritarian_influence1_desc: "这颗星球保留着对一位过去统治这里的本地君主的记忆，并深受其影响。"

cc_egalitarian_influence1: "直接民主制的精神遗产"
cc_egalitarian_influence1_desc: "这颗星球保留着对过去直接民主自治体系的记忆，并深受其影响。"

cc_xenophile_influence1: "亲外主义精神遗产"
cc_xenophile_influence1_desc: "这颗星球保留着对以前当地一位备受爱戴的亲外主义活动家的记忆，并深受其影响。"

cc_xenophobe_influence1: "排外主义精神遗产"
cc_xenophobe_influence1_desc: "这颗星球以前曾活跃着一名充满个人魅力的"霸权家"，他致力于保护这里免受外来影响。至今民众依然保留着对他的记忆，并深受其影响。"

cc_materialist_influence1: "唯物主义精神遗产"
cc_materialist_influence1_desc: "这颗星球保留着对以前当地一位备受爱戴的学者的记忆，并深受其影响。"

cc_spiritualist_influence1: "唯心主义精神遗产"
cc_spiritualist_influence1_desc: "这颗星球保留着对以前当地一位备受爱戴的长老的记忆，并深受其影响。"

cc_pacifist_influence1: "和平主义精神遗产"
cc_pacifist_influence1_desc: "这颗星球保留着对以前当地一位备受爱戴的和平主义活动家的记忆，并深受其影响。"

cc_militarist_influence1: "$cc_militarist_influence$"
cc_militarist_influence1_desc: "这颗星球以前曾活跃着一名退休舰队军官，被称为"行星使节"。至今民众依然保留着对他的记忆，并深受其影响。"

leader_trait_dpe_talented: "天赋异禀"
leader_trait_dpe_talented_desc: "这位领袖拥有常人难以企及的天才，能够轻松成为自己领域中的大师。"




dpe_leader.1.desc: "在[system.GetName]星系最近的战斗中，[ship.GetName]号的舰长[officer.GetName]表现卓越，令舰队司令[dpe_admiral.GetName]大为折服，正式要求为这名军官升职。如果您认为我们需要一名新的舰队司令，我们会立即提拔[officer.GetHimHer]。请您示下。"
dpe_leader.2.desc: "在最近的战斗中，由于高层将领的缺席，下层军官们得以崭露头角：[ship.GetName]号的舰长[officer.GetName]主动担起指挥重任，并引领我们取得胜利。舰队中的许多高层都对[officer.GetHimHer]所显露的能力赞赏有加，要求为其升职。我们要提拔[officer.GetHimHer]吗？"
dpe_leader.1.A: "好极了，提拔[officer.GetHimHer] "
dpe_leader.1.A.tooltip: "一位2级舰队司令会被加入领袖库"
dpe_leader.1.B: "我们已经有足够的高层将领"
dpe_talented_captain: "技艺高超的舰长"


cc_luddite.30.name: "机械劳工大受欢迎"
cc_luddite.30.desc: "随着机械劳工被引入[root.GetName]，[root.GetSpeciesAdj]民众对人工智能与机器人的热情不断高涨。一些反对者担忧大规模应用机器人将会带来冲击与潜在威胁，但他们的观点正逐渐被边缘化。新技术带来的生活水准提升已将疑虑的声音一扫而空。现在大家都对机器人趋之若鹜，相关新兴企业如雨后春笋般蓬勃发展。"
cc_antiluddite: "机械劳工大受欢迎"




 dpe_dissent_planet: "Anti-Government Feeling"
 dpe_dissent_planet_desc: "The populace of this planet is somewhat disenchanted at recent government decisions."
 dpe_posenergy_planet: "Energy Surplus"
 dpe_posenergy_planet_desc: "Good weather and hard work have allowed this planet to overshoot its energy production targets."
 dpe_negenergy_planet: "Energy Shortfall"
 dpe_negenergy_planet_desc: "Poor weather has forced this planet to miss its energy production targets."
 dpe_posminerals_planet: "New Deposits Found"
 dpe_posminerals_planet_desc: "Newly found deposits make this planet's mining enterprises particularly profitable."
 dpe_negminerals_planet: "Mineral Depletion"
 dpe_negminerals_planet_desc: "The deposits on this planet are becoming depleted, meaning that the mining enterprises are having to spend more time looking for new ones to mine."

 dpe_smallpos_events.20.name: "Unrest Brewing on [root.GetName]"
 dpe_smallpos_events.20.desc.A: "There is considerable dissent on [root.GetName] regarding a recent decision on a key infrastructure project by the governor. As a result, various underlying issues have bubbled to the surface, leading to a wave of dissatisfaction at the current government."
 dpe_smallpos_events.20.desc.B: "There is considerable dissent on [root.GetName] regarding a recent decision to increase local taxes by the governor. As a result, various underlying issues have bubbled to the surface, leading to a wave of dissatisfaction at the current government."

 dpe_smallpos_events.21.name: "Energy Surplus on [root.GetName]"
 dpe_smallpos_events.21.desc: "A combination of favourable weather conditions on one of [root.GetName]'s largest continents and the dedication of our workers has allowed the planetary energy company to overshoot its production targets. As a result, we have a sizeable energy surplus from [root.GetName]."
 dpe_smallpos_events.21.desc.gestalt: "A combination of favourable weather conditions on one of [root.GetName]'s largest continents and the tireless efforts of our worker drones has allowed our planetary energy subdivision to overshoot its production targets. As a result, we have a sizeable energy surplus from [root.GetName]."

 dpe_smallpos_events.22.name: "Energy Shortfall on [root.GetName]"
 dpe_smallpos_events.22.desc: "The excessively long and harsh winter that [root.GetName]'s largest continent is experiencing has caused energy consumption to increase significantly, whilst decreasing the efficacy of solar-based energy production. As a result, the planet is experiencing some energy shortfalls."
 dpe_smallpos_events.22.desc.gestalt: "$dpe_smallpos_events.22.desc$"

 dpe_smallpos_events.23.name: "New Deposits found on [root.GetName]"
 dpe_smallpos_events.23.desc: "[root.GetName]'s main mining company reports the finding of a major new vein of high-quality ore. This will surely boost production!"
 dpe_smallpos_events.23.desc.gestalt: "Our mining drones on [root.GetName] report the finding of a major new vein of high-quality ore. This will surely boost production!"

 dpe_smallpos_events.24.name: "Mineral Depletion on [root.GetName]"
 dpe_smallpos_events.24.desc: "[root.GetName]'s main mining company reports difficulties in meeting production targets. It seems that some of the planet's main deposits have become depleted, and they have had to spend additional time surveying to replace them."
 dpe_smallpos_events.24.desc.gestalt: "Our mining drones on [root.GetName] report difficulties in meeting production targets. It seems that some of the planet's main deposits have become depleted, and they have had to spend additional time surveying to replace them."

 
 
 
###Defecting Leaders

 dpe_defect_leader.2.name: "Incoming Transmission"
 dpe_defect_leader.2.desc.military: "All praise to my [root.GetRulerTitle]! I am [dpe_defect_leader.GetName], a [dpe_defect_leader.GetTitle] in the [dpe_defected_country.GetName]. However, my loyalties lie with my kin, not with the [dpe_defected_country.GetSpeciesNamePlural]. I have gained access to the [dpe_defected_country.GetSpeciesNamePlural]'s best-kept military secrets and am prepared to defect at a moment's notice, if you will promise me protection from the [dpe_defected_country.GetSpeciesAdj] authorities."
 dpe_defect_leader.2.desc.civilian: "All praise to my [root.GetRulerTitle]! I am [dpe_defect_leader.GetName], a [dpe_defect_leader.GetTitle] in the [dpe_defected_country.GetName]. However, my loyalties lie with my kin, not with the [dpe_defected_country.GetSpeciesNamePlural]. I have gathered a stash of [dpe_defected_country.GetSpeciesAdj] [dpe_defect_leader.GetDPEDefectorText] and am prepared to defect at a moment's notice, if you will promise me protection from the [dpe_defected_country.GetSpeciesAdj] authorities."
 dpe_defect_leader.2.A: "You are a true [root.GetSpeciesName]."
 dpe_defect_leader.2.A.tooltip: "[dpe_defect_leader.GetTitle] [dpe_defect_leader.GetName] will join the [root.GetName]. The [dpe_defected_country.GetName] will be greatly annoyed.\n"
 dpe_defects_scientist_tooltip: "The [root.GetName] gains a lump sum of research.\n"
 dpe_defects_governor_tooltip: "The [root.GetName] gains a lump sum of energy and minerals.\n"
 dpe_defect_leader.2.B: "We will not take in traitors."
 dpe_defect_leader.2.B.tooltip: "Hand [dpe_defect_leader.GetHimHer] over to the [dpe_defected_country.GetSpeciesNamePlural]. They will be pleased."

 dpe_defect_leader.3.name: "Defecting [dpe_defect_leader.GetTitle]!"
 dpe_defect_leader.3.desc.military: "[dpe_defect_leader.GetName] has hacked into our military secrets and defected to the [from.GetName]. This is a terrible breach of trust from an officer in our armed forces. Elements of society are holding this up as the ultimate proof that xenos are not to be trusted, and demand that the government become a truly [root.GetSpeciesAdj] government."
 dpe_defect_leader.3.desc.civilian: "[dpe_defect_leader.GetName] has gathered a stash of [dpe_defect_leader.GetDPEDefectorText] and defected to the [from.GetName]. This is a terrible breach of trust from a government official. Elements of society are holding this up as the ultimate proof that xenos are not to be trusted, and demand that the government become a truly [root.GetSpeciesAdj] government."
 dpe_defect_leader.3.A: "Maybe they are right!"
 dpe_defect_leader.3.B: "Merely lodge a complaint with the [from.GetSpeciesNamePlural]."

 dpe_defect_leader.4.name: "Incoming Transmission"
 dpe_defect_leader.4.desc.military: "Greetings, [root.GetSpeciesName]. [dpe_defect_leader.GetName], one of your [dpe_defect_leader.GetTitle]s, has contacted us, proposing to defect and hand over your military secrets to us. Valuing our relationship with you, we have rejected [dpe_defect_leader.GetHisHer] offer. We leave the choice of what further actions are to be taken to you."
 dpe_defect_leader.4.desc.civilian: "Greetings, [root.GetSpeciesName]. [dpe_defect_leader.GetName], one of your [dpe_defect_leader.GetTitle]s, has contacted us, proposing to defect with a stash of your [dpe_defect_leader.GetDPEDefectorText]. Valuing our relationship with you, we have rejected [dpe_defect_leader.GetHisHer] offer. We leave the choice of what further actions are to be taken to you."
 dpe_defect_leader.4.A: "Many thanks. Arrest [dpe_defect_leader.GetHimHer]!"
 dpe_defect_leader.4.B: "This is why we shouldn't have xenos in positions of authority!"

 dpe_defect_leader.6.desc.military: "It seems our confidence in [dpe_defect_leader.GetName] was misplaced. [dpe_defect_leader.GetSheHeCap] has defected to the [from.GetName], taking with [dpe_defect_leader.GetHimHer] information on our best-kept military secrets. This is a terrible breach of trust from an officer in our armed forces. Elements of society are holding this up as the ultimate proof that xenos are not to be trusted, and demand that the government become a truly [root.GetSpeciesAdj] government."
 dpe_defect_leader.6.desc.civilian: "It seems our confidence in [dpe_defect_leader.GetName] was misplaced. [dpe_defect_leader.GetSheHeCap] has defected to the [from.GetName], taking with [dpe_defect_leader.GetHimHer] a stash of [dpe_defect_leader.GetDPEDefectorText]. This is a terrible breach of trust from a government official. Elements of society are holding this up as the ultimate proof that xenos are not to be trusted, and demand that the government become a truly [root.GetSpeciesAdj] government."

 dpe_defect_leader.20.desc.military: "It appears that [dpe_defect_leader.GetName] noticed our investigations into [dpe_defect_leader.GetHimHer]. Before we realised what was happening, [dpe_defect_leader.GetSheHe] enacted [dpe_defect_leader.GetHisHer] escape plan and left for the [dpe_defect_to_country.GetName] with [dpe_defect_leader.GetHisHer] knowledge of our military secrets. This is a terrible breach of trust from an officer in our armed forces. Elements of society are holding this up as the ultimate proof that xenos are not to be trusted, and demand that the government become a truly [root.GetSpeciesAdj] government."
 dpe_defect_leader.20.desc.civilian: "It appears that [dpe_defect_leader.GetName] noticed our investigations into [dpe_defect_leader.GetHimHer]. Before we realised what was happening, [dpe_defect_leader.GetSheHe] enacted [dpe_defect_leader.GetHisHer] escape plan and left for the [dpe_defect_to_country.GetName] with [dpe_defect_leader.GetHisHer] stash of [dpe_defect_leader.GetDPEDefectorText]. This is a terrible breach of trust from a government official. Elements of society are holding this up as the ultimate proof that xenos are not to be trusted, and demand that the government become a truly [root.GetSpeciesAdj] government."

 dpe_defect_leader.5.name: "Allegations of Disloyalty"
 dpe_defect_leader.5.desc: "A member of [dpe_defect_leader.GetTitle] [dpe_defect_leader.GetName]'s staff claims that [dpe_defect_leader.GetSheHe] is preparing to defect to the [dpe_defect_to_country.GetName]. They claim to have overheard [dpe_defect_leader.GetHimHer] talking with other [dpe_defect_to_country.GetSpeciesNamePlural] and to have understood enough to work out what the subject was. However, they are unable to provide evidence to back up their story."
 dpe_defect_leader.5.A: "[dpe_defect_leader.GetSheHeCap] has our full confidence!"
 dpe_defect_leader.5.A.defects: "[dpe_defect_leader.GetName] defects."
 dpe_defect_leader.5.A.not_defects: "[dpe_defect_leader.GetName] remains loyal.\nInspired by [dpe_defect_leader.GetHisHer] example and the trust shown in [dpe_defect_leader.GetHimHer] by the government, the country gains the $dpe_defect_trust_in_xenos$ modifier, giving +5% citizen happiness and +50% xenophile attraction." 
 dpe_defect_leader.5.B: "Arrest [dpe_defect_leader.GetHimHer] immediately!"
 dpe_defect_leader.5.B.tooltip: "The [dpe_defect_to_country.GetName] may protest this action."
 dpe_defect_leader.5.C: "Investigate [dpe_defect_leader.GetHimHer] discreetly."
 dpe_defect_leader.5.C.caught_guilty: "[dpe_defect_leader.GetName] is found guilty."
 dpe_defect_leader.5.C.flees: "[dpe_defect_leader.GetName] flees before we catch [dpe_defect_leader.GetHimHer]."
 dpe_defect_leader.5.C.no_evidence: "[dpe_defect_leader.GetName] is exonerated."
 dpe_defect_leader.5.C.caught_investigating_not_guilty: "[dpe_defect_leader.GetName] uncovers our suspicions and resigns in protest."

 dpe_defect_leader.7.name: "Trust Well Deserved"
 dpe_defect_leader.7.desc: "It appears that our confidence in [dpe_defect_leader.GetName] was not misplaced. Not only has [dpe_defect_leader.GetSheHe] not defected, but [dpe_defect_leader.GetSheHe] has managed to restore public confidence in [dpe_defect_leader.GetHimHer]self, and is now seen as a model of xeno integration into [root.GetSpeciesAdj] society."

 dpe_defect_leader.8.name: "[dpe_defect_leader.GetName] is a Traitor"
 dpe_defect_leader.8.desc: "Our investigation into [dpe_defect_leader.GetName] has turned up clear evidence that [dpe_defect_leader.GetSheHe] [dpe_defect_leader.GetIsAre] planning to defect. We must take immediate action!"
 dpe_defect_leader.8.A: "Arrest [dpe_defect_leader.GetHimHer]!"
 dpe_defect_leader.8.B: "Let's test the [dpe_defect_to_country.GetSpeciesNamePlural]."
 dpe_defect_leader.8.B.tooltip: " We will keep [dpe_defect_leader.GetName] under surveillance and will arrest [dpe_defect_leader.GetHimHer] as soon as we know whether the [dpe_defect_to_country.GetSpeciesNamePlural] would take [dpe_defect_leader.GetHimHer] in."

 dpe_defect_leader.9.name: "No Evidence of Wrongdoing"
 dpe_defect_leader.9.desc: "Our investigation into [dpe_defect_leader.GetName] has turned up no evidence that [dpe_defect_leader.GetSheHe] [dpe_defect_leader.GetWasWere] planning to defect. Having publicly stated our confidence in [dpe_defect_leader.GetName], we can breathe a sigh of relief and consider the matter closed."

 dpe_defect_leader.10.name: "Resignation Letter"
 dpe_defect_leader.10.desc: "My [root.GetRulerTitle], it has come to my notice that you are investigating me for my supposed disloyalty to the [root.GetName]. As one who has always considered [dpe_defect_leader.GetHimHer]sel[dpe_defect_leader.GetFVes] a [root.GetSpeciesName] citizen as much as a [dpe_defect_leader.GetSpeciesName], I am most disappointed in this lack of confidence in me. It is therefore with regret that I must tender my resignation. I cannot serve a government in which I am not welcome."

 dpe_defect_leader.11.name: "National Incarcerated"
 dpe_defect_leader.11.desc: "It has come to our attention that [dpe_defect_leader.GetName], a [root.GetSpeciesAdj] who had been a high government official in the [from.GetName], faces persecution on account of [dpe_defect_leader.GetHisHer] species. Taking up [dpe_defect_leader.GetHisHer] case could be a good opportunity to embarrass the [from.GetSpeciesNamePlural] while furthering the [root.GetSpeciesAdj] cause."
 dpe_defect_leader.11.A: "Lodge a complaint."
 dpe_defect_leader.11.B: "The fate of this sell-out is of no concern to us."

 dpe_defect_leader.12.name: "Incoming Transmission"
 dpe_defect_leader.12.desc: "[root.GetSpeciesName], we have heard that you are persecuting one of our nationals, [dpe_defect_leader.GetName], on account of [dpe_defect_leader.GetHisHer] species. We demand that [dpe_defect_leader.GetSheHe] be allowed to take asylum in the [from.GetName]."
 dpe_defect_leader.12.A: "You may have [dpe_defect_leader.GetHimHer]."
 dpe_defect_leader.12.B: "No way."

 dpe_defect_leader.13.name: "$dpe_title_response$"
 dpe_defect_leader.13.desc: "Fine, take [dpe_defect_leader.GetHimHer]. [dpe_defect_leader.GetSheHeCap] [dpe_defect_leader.GetIsAre] of no use to us, anyway."

 dpe_defect_leader.14.name: "$dpe_title_response$"
 dpe_defect_leader.14.desc: "You may not have [dpe_defect_leader.GetHimHer]. [dpe_defect_leader.GetSheHeCap] has penance to serve in our jails."
 dpe_defect_leader.14.option: "You will live to regret this."

 dpe_defect_leader.18.name: "Caught in the Act"
 dpe_defect_leader.18.desc: "Did you really think it wouldn't escape our notice that one of our own government officials was planning to defect? [dpe_defect_leader.GetName] has been apprehended and will remain in our custody. We are most disappointed that [dpe_defect_leader.GetSheHe] had your encouragement."
 dpe_defect_leader.18.option: "We've been had."


