l_russian:


dpe_conspiracy.20.name: "Речь изменника"
dpe_conspiracy.20.desc: "Ранее сегодня, [authoritarian.GetTitle] [authoritarian.GetName] выступил с важной речью, которая транслировалась по всем основным каналам связи. В этой речи прозвучали идеи близкие к предательским: [authoritarian.GetSheHeCap] нарисовал картину того, как [root.GetName] приходится справляться со множеством испытаний, в то время как правительство, слабое и разделенное, беспомощно стоит в стороне и ничего не делает. [authoritarian.GetSheHe] убежден, что для решения возникшей ситуации нужна новая форма правительства с сильной исполнительной властью, способной принимать жесткие решения, необходимые для восстановления величия [root.GetSpeciesAdj]. [authoritarian.GetSheHeCap] намекнул, что если правительство не начнет действовать, то "заинтересованные, патриотичные граждане" возмут дело в свои руки.\n\nС тех пор [authoritarian.GetName] затаился. Местонахождение [authoritarian.GetHisHerCap] неизвестно, но [authoritarian.GetSheHe] оставил зашифрованное сообщение, в котором содержатся извинения за секретность и объяснение того, что [authoritarian.GetSheHe] боится за свою жизнь в нынешней политической ситуации. В сообщении так же оставлены детали того, как можно связаться с [authoritarian.GetSheHeCap], если на то "есть причина".\n\nКак нам это реагировать?"
dpe_conspiracy.20.A: "Арестуйте предателя!"
dpe_conspiracy.20.A.tooltip: "Служба разведки попытается выследить и арестовать [authoritarian.GetName]."
dpe_conspiracy.20.B: "Потребовать объяснений."
dpe_conspiracy.20.C: "[authoritarian.GetSheHeCap] прав!"
dpe_conspiracy.20.D: "Проигнорировать [authoritarian.GetHimHer]."

dpe_conspiracy.21.name: "Успешный арест [authoritarian.GetName]!"
dpe_conspiracy.21.desc: "Служба разведки смогла выследить и арестовать [authoritarian.GetName]. [authoritarian.GetSheHeCap] отныне находится под следствием из-за своего предательства перед государством. Надеюсь, это последнее, что мы услышим о [authoritarian.GetSheHeCap]."

dpe_conspiracy.211.name: "[authoritarian.GetName] делает признание в заговоре!"
dpe_conspiracy.211.desc: "После строго допроса, от [authoritarian.GetName] удалось добиться признания, что [authoritarian.GetName] принимал участие в заговоре против [root.GetRulerTitle]. Однако, как только были озвучены имена соучастников [authoritarian.GetHimHer], выяснилось, что большинство из них испугались ареста [authoritarian.GetName] и отправились в добровольную ссылку в [rival.GetName]. Наши пограничные силы были проинструктированы по поводу сих лиц, дабы предотвратить их возможный возврат в [root.GetName]. Граждане [root.GetSpeciesAdj] отныне могут с облегчением вздохнуть."

dpe_conspiracy.22.name: "Арест [authoritarian.GetName] провалился!" 
dpe_conspiracy.22.desc: "Наша служба разведки не смогла выследить [authoritarian.GetName]. Текущее местонахождение и деятельность [authoritarian.GetHisHerCap] неизвестны. Кто знает, что ещё планирует сделать [authoritarian.GetSheHe]?"

dpe_conspiracy.23.name: "[authoritarian.GetName] реагирует"
dpe_conspiracy.23.desc: "Прошу меня простить, [root.GetRulerName]... но это была лишь кристальная истина, и мой долг состоял в том, чтобы раскрыть её. Я не постесняюсь действовать, чтобы защитить будущее государства [root.GetSpeciesAdj]."
dpe_conspiracy.23.option: "[authoritarian.GetHimHer] продолжает говорить."

dpe_conspiracy.24.name: "$dpe_conspiracy.23.name$"
dpe_conspiracy.24.desc: "Знайте, что я планировал это в течение очень долгого времени. Ваш единственный шанс сохранить лицо - это уйти в отставку и позволить более умелым рукам руководить." 
dpe_conspiracy.24.A: "Без шансов. Арестовать предателя!"
dpe_conspiracy.24.A.tooltip: "$dpe_conspiracy.20.A.tooltip$"
dpe_conspiracy.24.A.response: "Да будет так."
dpe_conspiracy.24.B: "Может быть [authoritarian.GetSheHe] прав..."
dpe_conspiracy.24.B.tooltip: "$dpe_conspiracy.27.A.tooltip$"
dpe_conspiracy.24.B.response: "Прекрасно. Моя вера в [root.GetName] восстановлена."
dpe_conspiracy.24.C: "Будьте бдительны."

dpe_conspiracy.25.name: "Заговор раскрыт!"
dpe_conspiracy.25.desc: "Служба разведки [root.GetSpeciesAdj] раскрыла обширный заговор о создании авторитарной формы правления в [root.GetName]. [authoritarian.GetName] является номинальным главой сего заговора, но похоже, что [authoritarian.GetName] поддерживают очень большое число влиятельных [root.GetSpeciesNamePlural], а так же важные в армии фракции. Если ничего не предпринять, наиболее вероятно, что вскоре они попытаются свергнуть существующую систему и установить авторитарный режим."
dpe_conspiracy.25.A: "Задействует все силы против них. Установите блокаду."
dpe_conspiracy.25.A.tooltip: "Заговорщикам будет трудно избежать обнаружения."
dpe_conspiracy.25.B: "Удвойте усилия, чтобы поймать заговорщиков."

dpe_state_in_lockdown: "Запреты правительства"
dpe_state_in_lockdown_desc: "Правительство запретило большинство видов деятельности в попытке выследить и подавить заговор, направленный против него."
dpe_state_in_lockdown_faction: "Сокращение гражданской свободы"

dpe_conspiracy.26.name: "Заговорщики арестованы!"
dpe_conspiracy.26.desc: "Службам разведки и безопасности [root.GetSpeciesAdj] удалось определить личности нескольких главарей авторитарного заговора, а так же их местонахождение. С помощью добытой информации службам удалось арестовать заговорщиков из [authoritarian.GetName] и эффективно разрушить их планы."

dpe_conspiracy.27.name: "Заговор!"
dpe_conspiracy.27.desc: ""Я не хотел, чтобы дошло до этого. Но я не позволю вам уничтожить [root.GetName]."\n\n[root.GetRulerTitle] [root.GetRulerName] оборачивается. Там стоит [authoritarian.GetName], держа пистолет, который направлен прямо на [root.GetRulerName]. "Не беспокойте свою охрану. Они все поддерживают меня," холодно процедил [authoritarian.GetName]. "Теперь у вас есть два пути. Вы либо подпишите вот эту бумагу, благодаря чему окажете поддержку новому режиму, а затем отправитесь в изгнание, либо я застрелю вас прямо здесь и сейчас. Вам решать.""
dpe_conspiracy.27.desc.clever: ""Я не хотел, чтобы дошло до этого. Но я не позволю вам уничтожить [root.GetName]."\n\n[root.GetRulerTitle] [root.GetRulerName] оборачивается. Там стоит [authoritarian.GetName], держа пистолет, который направлен прямо на [root.GetRulerName]. "Вы!"\n\n[authoritarian.GetName] выдавливает из себя холодную улыбку. "Да, я. Вы почти достали нас, знаете ли. В какой-то момент я почти засомневался в том, правильно ли я поступаю. Почти." [authoritarian.GetSheHeCap] театрально вздыхает. "Не беспокойте свою охрану. Они все поддерживают меня. Теперь у вас есть два пути. Вы либо подпишите вот эту бумагу, благодаря чему окажете поддержку новому режиму, а затем отправитесь в изгнание, либо я застрелю вас прямо здесь и сейчас. Вам решать.""
dpe_conspiracy.27.desc.stupid: ""Я не хотел, чтобы дошло до этого. Но я не позволю вам уничтожить [root.GetName]."\n\n[root.GetRulerTitle] [root.GetRulerName] оборачивается. Там стоит [authoritarian.GetName], держа пистолет, который направлен прямо на [root.GetRulerName].\n\n"Я не услышал, как вы подошли", сказал [root.GetRulerName].\n\n[authoritarian.GetName] выдавливает из себя холодную улыбку. "В этом-то и проблема. Вы всегда были слишком слабы, чтобы сделать то, что должно сделать." [authoritarian.GetSheHeCap] театрально вздыхает. "Не беспокойте свою охрану. Они все поддерживают меня. Теперь у вас есть два пути. Вы либо подпишите вот эту бумагу, благодаря чему окажете поддержку новому режиму, а затем отправитесь в изгнание, либо я застрелю вас прямо здесь и сейчас. Вам решать.""
dpe_conspiracy.27.A: "Молча подписать."
dpe_conspiracy.27.A.tooltip: "[root.GetRulerTitle] [root.GetRulerName] складывает с себя полномочия и уходит в отставку."
dpe_conspiracy.27.B: "Бороться до конца!"

dpe_illegitimate_regime: "Незаконный режим"
dpe_illegitimate_regime_desc: "Нынешний режим был установлен силой благодаря заговору, чьим кульминационным моментом стало убийство формального лидера империи." 

dpe_seized_control_faction: "Захваченный контроль"
dpe_lost_control_faction: "Потеря контроля через заговор"

dpe_conspiracy.28.name: "Заговор терпит фиаско"
dpe_conspiracy.28.desc: "Поползли разные слухи, когда [authoritarian.GetName] исчез с радаров. Однако наша служба разведки осталась лояльной нам и смогла предотвратить все попытки заговорщиков. Активность мятежников сошла на нет, а [authoritarian.GetName] и вовсе был замечен в изгнании в [rival.GetName], смирившись со своим провалом."




dpe_conspiracy.1.name: "ВКФ ходатайствует в правительство"
dpe_conspiracy.1.desc: "Для [root.GetRulerTitle] [root.GetRulerName],\n\nСейчас, возможно, настал момент признать жизненно важный вклад космического флота в обеспечение безопасности и стабильности [root.GetName], а так же политического положения империи на галактической арене. Мы - это мощная сила, которая неустанно работает, чтобы противостоять любой угрозе гражданам и их государству. Наши высококвалифицированные экипажи являются одними из самых искуссных экипажей в галактике, а наши современные военные корабли не имеют аналогов в мире.\n\nИменно поэтому мы с сожалением наблюдаем нынешнее положение космического флота во внутренней политике [root.GetSpeciesAdj]. Для наших офицеров, не говоря уже о наших адмиралах, стало кристально ясным, что флот низложен до такой степени, что его считают само собой разумеющимся, чем-то обыденным. Мало того, что нашим офицерам и космическим десантникам сильно недоплачивают, так ещё и наблюдается чрезмерное вмешательство гражданских в дела флота: гражданские органы определяют задания флота, а так же всю нашу политику найма и продвижения по службе; они даже имеют право осуждать успешных командиров за их непочтительнось во время исполнения долга. Что касается жизненно важных интересов флота - у нас просто нет права голоса.\n\nСложившаяся ситуация препятствует флоту исполнять его прямые обязанности по защите [root.GetName]. Поверьте, всё это не в ваших интересах, [root.GetRulerTitle]. Если не произойдет каких-нибудь изменений, то мы не можем и далее гарантировать безопасность государства, а так же вашего правительства.\n\nС глубоким уважением,\n[militarist.GetName],\nЛидер [militarist_faction.GetName] и избранный посол от Военно-Космического Флота [root.GetSpeciesAdj]."
dpe_conspiracy.1.A: "Настало время принять более милитаристские взгляды." 
dpe_conspiracy.1.B: "Возможно, наш флот нуждается в большем количестве денег."
dpe_extra_naval_expenses: "Дополнительные военно-космические расходы"
dpe_extra_naval_expenses_desc: "Правительство вынуждено увеличить расходы на военно-восмический флот, дабы обеспечить их дальнейшую лояльность."
dpe_conspiracy.1.C: "Флот и правительство следует разделить."
dpe_conspiracy.1.C.tooltip: "Военно-космические офицеры сильно расстроятся, если вы примите это решение. Нужно будет предпринять срочные шаги для уменьшения флотского влияние (например, сократить численность флота) или любым иным способом уменьшить влияние милитаристов в империи."
dpe_military_petition_rejected: "Отклонить ходатайство"

dpe_conspiracy.2.name: "Военно-космические офицеры вышли из послушания"
dpe_conspiracy.2.desc: "Похоже, что несколько высокопоставленных военно-космических офицеров отныне игнорируют ваши приказы. Вы не можете достучаться до них, используя любые средства связи. Советники выражают беспокойство по поводу того, что сие поведение может означать. Вы смогли связать с более низкопоставленными офицерами, но они заявили, что им ничего не известно о сложившейся ситуации."
#CCWORRYING

#(2 days later)
dpe_conspiracy.3.name: "Военный переворот!"
dpe_conspiracy.3.desc: "Это [militarist.GetName]. Я говорю от лица всего военно-космического флота [root.GetSpeciesAdj]. Наши адмиралы пришли к выводу, что правительство [root.GetSpeciesAdj] должно встать под покровительство флота для обеспечения безопасности империи. Орудия всех судов нацелены прямо на вас, а наши наземные силы сформировали защитный периметр вокруг [root.GetGovtBuilding]. Вы не можете никуда скрыться от нас. Если вы немедленно не сдадитесь, то мы разнесем на куски [root.GetGovtBuilding]. У вас есть один час, чтобы дать ответ."
dpe_conspiracy.3.option: "У нас нет выбора."
dpe_conspiracy.3.tooltip: "[root.GetRulerTitle] [root.GetRulerName] складывает с себя полномочия и уходит в изгнание."

#GetGovtBuilding:
ccloc_democracy_building: "Парламент"
ccloc_oligarchy_building: "Здание совета"
ccloc_others_building: "Ваш дворец"

dpe_military_coup_faction: "Военный переворот"

#Follow-up event (Paid ransom): 
dpe_conspiracy.4.name: "ВКФ хочет повышенного финансирования"
dpe_conspiracy.4.desc: "Для [root.GetRulerTitle] [root.GetRulerName],\n\nПрошло некоторое время с тех пор, как вы согласились помочь в укреплении позиций ваших славных и смелых военных, но теперь нам нужно больше. По мере расширения состава флота, моральным устареванием судов, развитием новых технологий, а также стремлением адмиралов продолжать свои исследовательские и опытно-конструкторские проекты, выделенные вами ранее деньги истаяли за последние года. Именно поэтому меня отправили к вам посланником, дабы я сообщил вам, что нам срочно требуется повышение финансирования и выдача кредитов ради защиты нашей национальной безопасности. Мы не можем прекратить платить людям, которые каждый день рискуют своими жизнями ради нашей великой нации, не правда ли?\n\nС наилучшими пожеланиями,\n[militarist.GetName],\nЛидер [militarist_faction.GetName] и избранный посол от военно-космического флота [root.GetSpeciesAdj]."
dpe_conspiracy.4.A: "Так и быть, держите вашу взятку. Флот должен продолжать выполнять приказы и защищать границы."
dpe_conspiracy.4.B: "Вооруженные силы подчиняются избранному гражданскому правительству - адмиралтейству следует зарубить это себе на носу!"
dpe_conspiracy.4.B.tooltip: "$dpe_conspiracy.1.C.tooltip$"
dpe_conspiracy.4.C: "Вы упомянули исследовательские и опытно-конструкторские проекты?"

dpe_extra_naval_expenses_2: "$dpe_extra_naval_expenses$"
dpe_extra_naval_expenses_2_desc: "$dpe_extra_naval_expenses_desc$"

dpe_conspiracy.5.name: "Исследовательские и опытно-конструкторские проекты ВКФ"
dpe_conspiracy.5.desc: "Адмиралтейство понимает, что флот потребляет значительную часть государственного бюджета. Таким образом, они решили попытаться превратить наш флот в самый продвинутый флот в галактике - образец современного флота. Тем не менее, ученые, лаборатории и материалы не дешевы, особенно с нашими самыми высокими стандартами. Как только они начнут получать необходимые денежные средства, они смогут начать совершенствовать вооруженные силы, дабы в конечном итоге заставить завидовать нам каждую разумную расу в галактике."
dpe_conspiracy.5.A: "Мы определенно можем материально поддержать эту новую исследовательскую инициативу."
dpe_conspiracy.5.B: "Нация не может себе этого позволить."
dpe_conspiracy.5.B.tooltip: "$dpe_conspiracy.1.C.tooltip$"

dpe_navy_RandD: "Инвестирование в исследования ВКФ"
dpe_navy_RandD_desc: "Государство вкладывается в модернизацию флота."


dpe_conspiracy.6.name: "Повышенные расходы на ВКФ напрасны?"
dpe_conspiracy.6.desc: "После поражения, нанесенного нам руками [fromfrom.GetName], многие задались вопросом: "На правое ли дело пошли дополнительно выделенные деньги для флота?" - в конце концов, именно наш флот, флот [root.GetName], не смог одержать победу. Уже сейчас другие департаменты лоббируют для себя дополнительные средства, утверждая, что они смогут оказать большее влияние на происходящие события, дабы вернуть [root.GetName] утраченное влияние."
dpe_conspiracy.6.A: "Флоту всё равно нужны наши деньги."
#only if the fleet has taken a beating
dpe_conspiracy.6.B: "Деньги должны быть перенаправлены для восстановления флота."
dpe_conspiracy.6.C: "Деньги лучше потратить на более полезные вещи."
#only if the fleet is still fully intact
dpe_conspiracy.6.C.tooltip: "$dpe_conspiracy.1.C.tooltip$"
dpe_conspiracy.6.C.tooltip2: "Офицеры военно-космического флота очень расстроятся. Должны быть предприняты шаги для того, чтобы влияние флота не увеличиваось настолько, что это дестабилизирует правительство, но при этом флот не должен слишком сильно размякнуть из-за подобного курса действий."

dpe_rebuilding_fleet: "Переоборудование флота"
dpe_rebuilding_fleet_desc: "Государство тратит бюджет на переоборудование флота из-за недавнего поражения."
dpe_rebuilding_fleet_2: "$dpe_rebuilding_fleet$"
dpe_rebuilding_fleet_2_desc: "$dpe_rebuilding_fleet_desc$"
dpe_naval_pay_cut_faction: "Понижение финансирования флота"
dpe_navy_privileges_cut_faction: "Уменьшение привилегий флота"
