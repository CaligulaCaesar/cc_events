l_russian:


cc_xeno_clashes.2.name: "Ненавистная речь в [root.GetName]"
cc_xeno_clashes.2.desc: "Ряд инцидентов вызвал рост напряженности между [species1.GetNamePlural] и [species2.GetNamePlural] в [root.GetName]. Общественная дискуссия моментально привела к обострению ксенофобии, и лидеры с обеих сторон начали заявлять, что [root.GetName] принадлежит им по праву. По рукам стали ходить документы, в которых один вид описывает другой в уничижительных терминах. А затем даже появились зловещие слухи среди [species2.GetNamePlural] о том, как можно решить "проблему [species1.GetAdj]"."
cc_xeno_clashes.2.desc.phile: "В причудливом повороте событий резко обострились дебаты о том, кто же предпочтительнее и лучше - [species1.GetNamePlural] или [species2.GetNamePlural]. Общественная дискуссия моментально привела к обострению ксенофобии, и лидеры с обеих сторон начали заявлять, что [root.GetName] принадлежит им по праву. По рукам стали ходить документы, в которых один вид описывает другой в уничижительных терминах. А затем даже появились зловещие слухи среди [species2.GetNamePlural] о том, как можно решить "проблему [species1.GetAdj]"."
cc_xeno_clashes.2.phile.own: "[species1.GetNamePlural] должны показывать лучший пример!"
cc_xeno_clashes.2.phobe.own: "Эта инопланетная мразь не ровня [species1.GetNamePlural]."
cc_xeno_clashes.2.own: "Мы должны сохранить мир."
cc_xeno_clashes.2.no_own: "$cc_xeno_clashes.2.own$"
cc_xeno_clashes.2.phobe.no_own: "Дайте этим инопланетным мразями разорвать друг друга на части."

cc_planet_hate_speech: "Ненавистная речь"
cc_planet_hate_speech_desc: "Порочные дискуссии способствую напряжению между разными видами на этой планете."

cc_xeno_clashes.3.name: "Взрыв межвидовой напряженности в [root.GetName]"
cc_xeno_clashes.3.desc.A: "Межвидовая напряженность [root.GetName] достигла точки кипения после массовых протестов среди населения [species2.GetAdj], вызванных арестом известного [species2.GetName], обвиняемого в коррупции. [species2.GetNamePlural] считают это последней каплей в череде репрессий властей [species1.GetAdj] против них . Это заставило недовольных выйти на улицы и выразить протест нынешнему положению дел. Со своей стороны, на улицы вышли такие же массовые контр-протесты лояльных государству [species1.GetAdj]. События быстро вышли из-под контроля, поскольку полиция не сумела удержать одну группу подальше от другой, что привело к массовой резне и кровопролитию. Была высла армия для восстановления порядка, но ситуация всё равно остаётся очень напряженной.\n\nЧто должно сделать в данной ситуации?"
cc_xeno_clashes.3.desc.B: "Межвидовая напряженность [root.GetName] достигла точки кипения после массовых протестов среди населения [species2.GetAdj], вызванных арестом известного [species2.GetName], обвиняемого в произнесении ненавистной речи к [species1.GetNamePlural], чтобы они убирались к себе домой. [species2.GetNamePlural] возмущены подобным ходом и посчитали это последней каплей в череде репрессий властей [species1.GetAdj] против них. Это заставило выйти недовольных на улицы и выразить протест нынешнему положению дел. Со своей стороны, на улицы вышли такие же массовые контр-протесты лояльных государству [species1.GetAdj]. События быстро вышли из-под контроля, поскольку полиция не сумела удержать одну группу подальше от другой, что привело к массовой резне и кровопролитию. Была высла армия для восстановления порядка, но ситуация всё равно остаётся очень напряженной.\n\nЧто должно сделать в данной ситуации?"
cc_xeno_clashes.3.A: "Для [species2.GetNamePlural] нет места в [root.owner.GetName]."
cc_xeno_clashes.3.A.tooltip: "Население [root.owner.GetName] - [species2.GetAdj] - будет оскорблено." 
cc_xeno_clashes.3.B: "Подобные инциденты неизбежны, но прискорбны."
cc_xeno_clashes.3.B.tooltip: "Есть шанс, что волнения могут усилиться и распространиться."
cc_xeno_clashes.3.C: "Мы должны найти способ, чтобы все расы ладили друг с другом."
cc_xeno_clashes.3.C.tooltip: "Кампания по примирению - подкреплённая внушительными финансовыми инвистициями - облегчит напряжённость на планете."

cc_xeno_clashes.31.name: "Основание фронта независимости [species2.GetAdj]"
cc_xeno_clashes.31.desc: "К проклятому [root.GetRulerTitle] [root.GetRulerName],\n\nМы должны поблагодарить вас за разъяснение того, что сообщество [species2.GetAdj] давно подозревало: Нам давно не рады в [root.GetName]. Вы будете определенно рады услышать, что мы планируем отделиться от вашей империи, как можно скорее. Тирания [species1.GetAdj] не может - не будет - продолжаться вечно!\n\nС уважением,\n[annoyed_xeno.GetName],\nЛидер Фронта Независимости [species2.GetAdj]."
cc_xeno_clashes.31.tooltip: "Все [species2.GetAdj] £pops получат модификатор §R$cc_feels_unwelcome$§!, дающий -20% СЧАСТЬЯ.\nВероятно дальнейшее межвидовое волнение."

cc_planet_interspecies_tensions: "Межвидовое напряжение"
cc_planet_interspecies_tensions_desc: "На этой планете растёт напряжение между разными видами."
cc_empire_interspecies_tensions: "Распространение межвидового напряжения"
cc_empire_interspecies_tensions_desc: "В империи растёт напряжение между разными видами."
cc_feels_unwelcome: "Нежелателен"
cc_xenos_disparaged: "Чужаки нежелательны"
cc_xenos_disparaged_sup: "$cc_xenos_disparaged$"
cc_xenos_encouraged: "Поощрение мирного сосуществования"

cc_xeno_reconciliation: "Примирение с чужаками"
cc_xeno_reconciliation_desc: "После периода чередующихся неприятностей, правительство разработало программу обеспечения примирения и мирного сосуществования между разными видами."
cc_investment_package: "Инвестиционный пакет"
cc_investment_package_desc: "Центральное правительство "инвестирует" в обеспечение спокойствия этой планеты."

cc_xeno_clashes.32.name: "Ополчение [species2.GetAdj] наносит удар!"
cc_xeno_clashes.32.desc: "Фронт независимости [species2.GetAdj] совершил атаку на [root.GetName]. Ополченцы [species2.GetName] застали в расплох сообщество [species1.GetAdj] и без предупреждения успели убить большое количество [species1.GetNamePlural]."
cc_xeno_clashes.32.option: "Мы должны действовать, чтобы не допустить дальнейшей бойни."

cc_xeno_clashes.33.name: "Фронт независимости [species2.GetAdj] наносит Удар!"
cc_xeno_clashes.33.desc: "Оперативники фронта независимости [species2.GetAdj] совершили разрушительную атаку на [species1.GetNamePlural] на [root.GetName]. Мощная ядерная бомба взорвалась прямо посреди густонаселенного района [species1.GetNamePlural], вызвав несметное количество жертв. Выжившие [species1.GetNamePlural] срочно обратились за помощью, чтобы противостоять дальнейшим террористическим атакам."
cc_xeno_clashes.33.option: "$cc_xeno_clashes.32.option$"


cc_xeno_clashes.34.name: "Фронт независимости [species2.GetAdj] наносит удар!"
cc_xeno_clashes.34.desc: "Фронт независимости [species2.GetAdj] запустил разрушительную кибер-атаку, направленную на власти [root.GetName]. Они причинили катастрофический ущерб и похитили засекреченные данные. Пока наше правительство ещё только приходит в себя, они уже собираются заменить его альтернативной администрацией [species2.GetAdj]."
cc_xeno_clashes.34.option: "Мы должны действовать, чтобы восстановить порядок."

cc_xeno_clashes.35.name: "Ополчение [species2.GetAdj] наносит удар!"
cc_xeno_clashes.35.desc: "Фронт независимости [species2.GetAdj] совершил атаку на [root.GetName]. Ополченцы [species2.GetName] застали в расплох нескольких местных чиновников, убив некоторых из них и парализовав управление планетой. В результате этого удара, [species2.GetNamePlural] попытаются заменить нынешнее правительство своей альтернативной администрацией."
cc_xeno_clashes.35.option: "$cc_xeno_clashes.34.option$"

cc_xeno_clashes.36.name: "Фронт независимости [species2.GetAdj] наносит Удар!"
cc_xeno_clashes.36.desc: "Оперативники фронта независимости [species2.GetAdj] совершили атаку на [root.GetName]. Похоже, что небольшая группа смертников смогла пронести высокомощную бомбу в правительственные здания, а затем взорвать её. Наше правительство искалечено потерей почти всего персонала и инфраструктуры, и пытается сдержать ситуацию под контролем."
cc_xeno_clashes.36.option: "$cc_xeno_clashes.34.option$"

cc_disrupted_government: "Нарушена работа правительства"
cc_disrupted_government_desc: "Мятежники нарушили работу планетарной администрации и пытаются основать своё параллельное правительство."

cc_xeno_clashes.37.name: "Резня на [root.GetName]"
cc_xeno_clashes.37.desc: "Если мы немедленно не вмешаемся, то обострившаяся ситуация на [root.GetName] неизбежно приведёт к геноциду и резне. Ополчение [species1.GetNamePlural] и [species2.GetNamePlural] были сформированы в глубоком секрете, а затем началась серия атак. [species2.GetNamePlural] получили преимущество в ранних столкновениях и успели захватить и разрушить один из крупнейших городов [species1.GetAdj], что привело к несметному количеству жертв."

cc_xeno_clashes.371.name: "Резня на [root.GetName]"
cc_xeno_clashes.371.desc: "Лидер ополчения [species1.GetAdj] попросил у правительства поддержки (и без последствий для него в будущем) в уничтожении своих солдат. Он пообещал, что сможет обезопасить и очистить планету от [species2.GetNamePlural]. Как нам ответить?"
cc_xeno_clashes.371.A: "Делайте это, если необходимо"
cc_xeno_clashes.371.B: "Введите военное положение, чтобы предотвратить дальнейшую резню."

cc_allowed_genocide_of_us: "Разрешить геноцид собственной расы"

cc_xeno_clashes.372.name: "$cc_xeno_clashes.31.name$"
cc_xeno_clashes.372.desc: "К проклятому [root.GetRulerTitle] [root.GetRulerName],\n\nВо вселенной нет таких слов, чтобы выразить всю глубину вашего предательства. Знайте, что вы сами сделали себя нашим врагом. Ваша тирания не может - не будет - продолжаться вечно!\n\nС уважением,\n[annoyed_xeno.GetName],\nЛидер Фронта Независимости [species2.GetAdj]."
cc_xeno_clashes.372.tooltip: "Все [species2.GetAdj] £pops получат модификатор §R$cc_pop_fears_genocide$§!, дающий -50% СЧАСТЬЯ.\nВероятно дальнейшее межвидовое волнение."

cc_pop_fears_genocide: "Страх геноцида"
cc_xenos_spared_from_massacre: "Спасённые чужаки"
cc_xenos_massacred: "Перебитые чужаки"

cc_martial_law: "Введено военное положение"
cc_martial_law_desc: "Центральное правительство ввело военное положение, чтобы сохранить мир на этой планете."


cc_xeno_clashes.382.name: "Межвидовые волнения распространились в [root.GetName]"
cc_xeno_clashes.382.desc: "Население [species1.GetAdj] и [species2.GetAdj] на [root.GetName] жадно следили за новостями с [from.GetName], и тамошняя общественная дискуссия начала отражаться и на [from.GetName]. Несмотря на то, что разные инциденты пока не получили широкого распространения, напряженность всё же высокая."

cc_xeno_clashes.383.name: "Межвидовое напряжение укоренилось на [root.GetName]"
cc_xeno_clashes.383.desc: "Напряжение между [species2.GetNamePlural] и [species1.GetNamePlural] распространилось, и теперь доминирует во всех дискуссиях, где две расы входят в контакт. Если ничего не предпринять, обязательно дойдет до насилия - и очень скоро!"

cc_xeno_clashes.383.A: "Ввести военное положение."
cc_xeno_clashes.383.B: "Нам будет лучше без [species2.GetNamePlural]."
cc_xeno_clashes.383.B.tooltip: "Напряжение между двумя видами скорее всего приведёт к взрыву."


cc_xeno_clashes.4.name: "Межвидовая напряженность достигла точки еипения в [root.GetName]"
cc_xeno_clashes.4.desc: "Межвидовая напряженность между [species1.GetNamePlural] и [species2.GetNamePlural] на [root.GetName] достигла точки кипения после того, как лоялист [species2.GetAdj] убил видного [species1.GetName]. Это вызвало массовые насильственные протесты среди населения [species1.GetAdj], которые начали нападать на [species2.GetNamePlural] на улицах. [species2.GetNamePlural] быстро организовали свой контр-протест, и из-за того, что полиция не смогла удержать события под контролем, а противостоящие стороны порознь друг от друга, случилась настоящая резня. Была развернута армия для восстановления порядка на улицах. Делегаты от обеих сторон предложили свои решения планетарному губернатору, который, в свою очередь, обратился к исполнительной власти за помощью в решение сложившейся ситуации.\n\nКаким должен быть ответ официального правительства?"
cc_xeno_clashes.4.A: "Поддержите [species1.GetNamePlural]."
cc_xeno_clashes.4.B: "Поддержите [species2.GetNamePlural]."
cc_xeno_clashes.4.C: "Введите военное положение до тех, пока они на научатся жить вместе."
cc_xeno_clashes.4.D: "Отправить команду для переговоров."
cc_xeno_clashes.4.E: "Ни один из них не достоин места в [root.owner.GetName]."

cc_xeno_clashes.4.A.tooltip: "Сообщество [species2.GetAdj] в [root.owner.GetName] будет оскорблено, но [species1.GetSpeciesNamePlural] почувствуют себя оправданными." 
cc_xeno_clashes.4.B.tooltip: "Сообщество [species1.GetAdj] в [root.owner.GetName] будет оскорблено, но [species2.GetSpeciesNamePlural] почувствуют себя оправданными."
cc_xeno_clashes.4.D.tooltip: "Может быть, разногласия можно разрешить с помощью дипломатии."
cc_xeno_clashes.4.E.tooltip: "Сообщество [species1.GetAdj] и [species2.GetAdj] в [root.owner.GetName] будет оскорблено."
#E:
cc_xeno_clashes.41.name: "Фомирование фронта независимости [species1.GetAdj]-[species2.GetAdj]"
cc_xeno_clashes.41.desc: "К проклятому [root.GetRulerTitle] [root.GetRulerName],\n\nДо этих самых пор, мы, нижеподписавшиеся, находились в разногласиях. Однако ваш ответ привёл нас к осознанию того, что у нас есть общий враг - [root.GetSpeciesNamePlural]. Мы разрешили наши проблемы и примирились с различиями, и теперь готовы действовать вместе для создания гармоничного государства вне состава [root.GetName].\n\nС уважением,\n[annoyed_xeno.GetName] и [annoyed_xeno2.GetName]\nЛидеры фронта независимости [species1.GetAdj]-[species2.GetAdj]."
cc_xeno_clashes.41.tooltip: "Все граждане £pops [species1.GetAdj] и [species2.GetAdj] получат модификатор §R$cc_feels_unwelcome$§!, дающий -20% СЧАСТЬЯ.\nВероятно, возможны дальнейшие межвидовые смятения."


cc_xeno_clashes.42.name: "Ополчение [species1.GetAdj]-[species2.GetAdj] наносит удар!"
cc_xeno_clashes.42.desc: "Фронт независимости [species1.GetAdj]-[species2.GetAdj] атаковал [root.GetName]. Ополчение [species1.GetNamePlural] и [species2.GetName] обрушились на население [root.owner.GetSpeciesAdj] без какого-либо предупреждения и успели убить многих [root.owner.GetSpeciesNamePlural]."
cc_xeno_clashes.42.option: "Мы должны действовать, чтобы предотвратить дальнейшую резню."

cc_xeno_clashes.43.name: "Фронт независимости [species1.GetAdj]-[species2.GetAdj] наносит удар!"
cc_xeno_clashes.43.desc: "Оперативники фронта независимости [species1.GetAdj]-[species2.GetAdj] совершили нападение на [root.owner.GetSpeciesNamePlural] на [root.GetName] с помощью ращрушительной атаки: Мощная ядерная бомба взорвалась посреди густонаселенного района [root.owner.GetSpeciesNamePlural], вызвав бесчисленное количество жертв. Выжившие [root.owner.GetSpeciesNamePlural] срочно обращаются к нам за помощью, чтобы предотвратить дальнейшие террористические атаки."
cc_xeno_clashes.43.option: "$cc_xeno_clashes.42.option$"


cc_xeno_clashes.44.name: "Фронт независимости [species1.GetAdj]-[species2.GetAdj] наносит удар!"
cc_xeno_clashes.44.desc: "Фронт еезависимости [species1.GetAdj]-[species2.GetAdj] запустили разрушительно кибер-атаку на наши власти на [root.GetName]. Они причинили катастрофический ущерб и похитили засекреченные данные. Пока наше правительство ещё только приходит в себя, они уже собираются заменить его альтернативной администрацией [species1.GetAdj]-[species2.GetAdj]."
cc_xeno_clashes.44.option: "Мы должны действовать, чтобы восстановить порядок."

cc_xeno_clashes.45.name: "Ополчение [species1.GetAdj]-[species2.GetAdj] наносит удар!"
cc_xeno_clashes.45.desc: "Фронт независимости [species1.GetAdj]-[species2.GetAdj] совершил нападение на [root.GetName]. Ополченцы [species2.GetName] обрушились на наших местных чиновников, некоторых убив, а другим не позволив эффективно управлять планетой. После этого удара, [species1.GetNamePlural] и [species2.GetNamePlural] пытаются заменить местное правительство своей альтернативой."
cc_xeno_clashes.45.option: "$cc_xeno_clashes.44.option$"

cc_xeno_clashes.46.name: "Фронт независимости [species1.GetAdj]-[species2.GetAdj] наносит удар!"
cc_xeno_clashes.46.desc: "Оперативники фронта независимости [species1.GetAdj]-[species2.GetAdj] совершили нападение на [root.GetName]. Похоже, что небольшая группа смертников смогла пронести высокомощную бомбу в правительственные здания, а затем взорвать её. Наше правительство искалечено потерей почти всего персонала и инфраструктуры, и пытается сдержать ситуацию под контролем."
cc_xeno_clashes.46.option: "$cc_xeno_clashes.44.option$"

cc_xeno_clashes.5.name: "Срыв переговоров на [root.GetName]"
cc_xeno_clashes.5.desc: "Переговоры по разрешению разногласий между [species1.GetNamePlural] и [species2.GetNamePlural] сорвались на [root.GetName]. Не будет быстрого прекращения напряжённости."
cc_xeno_clashes.5.A: "Тогда мы должны обеспечить мир."
cc_xeno_clashes.5.B: "Ах, хорошо."

cc_xeno_clashes.51.name: "Решение разногласий на [root.GetName]?"
cc_xeno_clashes.51.desc: "Переговоры по разрешению разногласий между [species1.GetNamePlural] и [species2.GetNamePlural] позволили этим двум видам найти общую почву. В самом деле, они теперь согласны с тем, что они могут восстановить мир, если будет оказана поддержка правительства [species1.GetAdj]. Подозрительно, но похоже, что эта поддержка будет включать в себя большой "пакет разработки", по-видимому, для обеспечение того, что планета будет достаточно успешной и процветающей, чтобы никакой напряженности не возникало."
cc_xeno_clashes.51.A: "Они получат нашу поддержку"
cc_xeno_clashes.51.B: "Наглость!"
cc_xeno_clashes.51.B.tooltip: "Мир на [root.GetName] может снова сорваться."

cc_xeno_clashes.52.name: "Мир срывается в [root.GetName]"
cc_xeno_clashes.52.desc: "Нелёгкое прекращение огня в [root.GetName]."
cc_xeno_clashes.52.A: "Тогда мы должны обеспечить мир."
cc_xeno_clashes.52.B: "Ах, хорошо."

cc_xeno_clashes.53.name: "Поддержания мира в [root.GetName]"
cc_xeno_clashes.53.desc: "Несмотря на наш отказ растранжиривания государственных фондов, [species1.GetNamePlural] и [species2.GetNamePlural] не выполнили своих угроз по возобновлению насилия, и непростой мир между этими видами удержался на [root.GetName]."

cc_ruled_against_our_pops: "Правило против наших граждан"
cc_ruled_against_us_pops: "Правило против нас"
cc_ruled_in_our_favour_pops: "Правило в нашу пользу"
